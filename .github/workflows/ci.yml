name: Foundation CI

on:
  pull_request:
  # Keep branch pushes enabled so this gate exists before its first merge to main.
  push: {}

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            frontend/acp-runtime/package-lock.json
            frontend/src/landing/package-lock.json
            packages/cloud-client/package-lock.json
            packages/product-ui/package-lock.json
            scripts/package-lock.json
      - name: Pin npm
        run: npm install --global npm@10.9.8
      - name: Bootstrap
        run: npm run bootstrap
      - name: Production dependency audit
        run: npm run audit:production
      - name: Foundation tests and generated-contract drift
        run: npm run test:foundation
      - name: Go lint
        run: npm run lint
      - name: Go race detector
        working-directory: backend
        run: go test -race ./...

  macos-package-identity:
    name: macOS package identity
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            frontend/acp-runtime/package-lock.json
            frontend/src/landing/package-lock.json
            packages/cloud-client/package-lock.json
            packages/product-ui/package-lock.json
            scripts/package-lock.json
      - name: Pin npm
        run: npm install --global npm@10.9.8
      - name: Bootstrap
        run: npm run bootstrap
      - name: Package without launching
        working-directory: frontend
        run: npm run package
      - name: Verify packaged identity and updater target
        working-directory: frontend
        run: npm run package:identity
